name: Deploy to GitHub Pages

# Publishes the static site (plain HTML/CSS/JS — no build step) to GitHub Pages.
# One-time setup: on GitHub go to Settings ▸ Pages ▸ Build and deployment ▸
# Source = "GitHub Actions". After that, every push to this branch deploys.

on:
  push:
    branches:
      - claude/gulmarg-ski-club-website-6cg6wp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # repo root is the site root (index.html at top)

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
