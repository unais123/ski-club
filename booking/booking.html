<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Widget — Demo | Gulmarg Ski Club</title>
  <meta name="robots" content="noindex">

  <!-- Montserrat (matches the main site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Booking widget styles -->
  <link rel="stylesheet" href="booking.css">

  <!-- OPTIONAL: EmailJS SDK (Action 2). Load BEFORE booking.js. -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script> -->

  <style>
    /* Demo-page chrome only — not part of the widget */
    body {
      margin: 0; font-family: "Montserrat", Arial, sans-serif;
      background: linear-gradient(180deg, #10183E 0%, #2A24C8 60%, #1815A5 100%);
      min-height: 100vh; padding: clamp(2rem, 6vw, 5rem) 1.2rem;
      color: #fff;
    }
    .demo-head { max-width: 760px; margin: 0 auto 2rem; text-align: center; }
    .demo-head h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 0.6rem; }
    .demo-head p { opacity: 0.85; margin: 0; }
    code { background: rgba(255,255,255,.15); padding: 0.15em 0.45em; border-radius: 6px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="demo-head">
    <h1>Booking Widget — Live Demo</h1>
    <p>This is how the reusable card renders. Embed it on any page with
      <code>&lt;div id="booking-container" data-expedition="Skiing"&gt;&lt;/div&gt;</code>.</p>
  </div>

  <!-- The widget mounts here. Change data-expedition per page. -->
  <div id="booking-container" data-expedition="Skiing"></div>

  <script src="booking.js" defer></script>
</body>
</html>
